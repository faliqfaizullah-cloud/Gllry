name: Build Windows app
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['win-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download fonts
        shell: bash
        continue-on-error: true
        run: sh get-fonts.sh
      - name: Install
        run: npm install
      - name: Build installer + portable exe
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Gllry-Windows
          path: |
            windows/dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/*.exe
