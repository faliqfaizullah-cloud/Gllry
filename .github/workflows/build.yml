name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: wri

git tag v1.0
git push origin v1.0
git tag v1.0
git push origin v1.0
cd ~/Gllry
mkdir -p .github/workflows
cat > .github/workflows/build.yml <<'EOF'
name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Remove Termux-only aapt2 path
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties
      - name: Build
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gllry.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gllry-apk
          path: Gllry.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Gllry.apk
